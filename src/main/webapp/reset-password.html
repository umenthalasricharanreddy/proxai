
<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #24104f, transparent 40%),
                radial-gradient(circle at bottom right, #071d45, transparent 40%),
                #050509;

            color: white;
        }

        .container {

            width: 380px;

            padding: 40px;

            background: rgba(20, 20, 35, 0.90);

            border: 1px solid rgba(150, 120, 255, 0.3);

            border-radius: 18px;

            box-shadow:
                0 0 30px rgba(100, 60, 255, 0.25);

        }

        h1 {

            text-align: center;

            margin-bottom: 10px;

            font-size: 28px;
        }

        .subtitle {

            text-align: center;

            color: #aaa;

            font-size: 14px;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #ddd;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #11111a;

            color: white;

            outline: none;

            font-size: 14px;
        }

        input:focus {

            border-color: #8b5cf6;

            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .back-login {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aeb8ff;

            text-decoration: none;

            font-size: 13px;
        }

        .back-login:hover {

            color: white;

            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Reset Password</h1>

        <p class="subtitle">
            Enter your new password
        </p>

        <form action="ResetPasswordServlet" method="post">

            <label>New Password</label>

            <input
                type="password"
                name="newPassword"
                placeholder="Enter new password"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirmPassword"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>

</html>
