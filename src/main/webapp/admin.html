
<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #f093fb
            );
        }

        .dashboard {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 450px;

            padding: 45px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .card h1 {
            color: #4a148c;

            font-size: 32px;

            margin-bottom: 15px;
        }

        .card p {
            color: #555;

            font-size: 17px;

            margin-bottom: 30px;

            line-height: 1.6;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .buttons button {
            border: none;

            padding: 13px 22px;

            border-radius: 10px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #6a11cb,
                #2575fc
            );

            transition: 0.3s;
        }

        .buttons button:hover {
            transform: translateY(-3px);

            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        .buttons button:last-child {
            background: linear-gradient(
                135deg,
                #ff512f,
                #dd2476
            );
        }

    </style>

</head>

<body>

    <div class="dashboard">

        <div class="card">

            <h1>Welcome, Admin</h1>

            <p>
                You have successfully logged in as administrator.
            </p>

            <div class="buttons">

                <!-- Manage Users -->
                <button onclick="window.location.href='ManageUsersServlet'">
                    Manage Users
                </button>

                <!-- View Profile -->
                <button onclick="window.location.href='ProfileServlet'">
                    View Profile
                </button>

            </div>

        </div>

    </div>

</body>

</html>
