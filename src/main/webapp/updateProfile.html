<!DOCTYPE html>

<html>

<head>
<title>Update Profile</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* BLACK BACKGROUND */
    body {
        min-height: 100vh;
        background: #000000;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 40px;
    }

    /* MAIN CARD */
    .profile-card {
        width: 500px;

        background: #151515;

        padding: 40px;

        border-radius: 20px;

        border: 2px solid #333333;

        box-shadow:
            0 0 25px #00ffff,
            0 0 50px rgba(138, 43, 226, 0.4);
    }

    /* USER ICON */
    .icon {
        width: 85px;
        height: 85px;

        margin: 0 auto 15px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 50%;

        background: linear-gradient(
            135deg,
            #00ffff,
            #8a2be2
        );

        font-size: 40px;

        box-shadow: 0 0 25px #00ffff;
    }

    /* TITLE */
    h1 {
        text-align: center;

        color: white;

        font-size: 30px;

        margin-bottom: 8px;
    }

    /* SUBTITLE */
    .subtitle {
        text-align: center;

        color: #aaaaaa;

        font-size: 15px;

        margin-bottom: 30px;
    }

    /* EACH DETAIL */
    .form-group {
        margin-bottom: 22px;
    }

    /* LABEL */
    label {
        display: block;

        color: #00ffff;

        font-size: 15px;

        font-weight: bold;

        margin-bottom: 8px;
    }

    /* INPUT AND SELECT */
    input,
    select {
        width: 100%;

        height: 48px;

        padding: 12px 15px;

        background: #222222;

        color: white;

        border: 2px solid #444444;

        border-radius: 10px;

        font-size: 15px;

        outline: none;
    }

    /* INPUT PLACEHOLDER */
    input::placeholder {
        color: #888888;
    }

    /* INPUT WHEN CLICKED */
    input:focus,
    select:focus {
        border-color: #00ffff;

        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
    }

    /* DROPDOWN */
    select {
        cursor: pointer;
    }

    select option {
        background: #222222;

        color: white;
    }

    /* UPDATE BUTTON */
    button {
        width: 100%;

        height: 52px;

        margin-top: 5px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #00ffff,
            #8a2be2
        );

        color: white;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    /* BUTTON HOVER */
    button:hover {
        transform: scale(1.02);

        box-shadow:
            0 0 15px #00ffff,
            0 0 25px #8a2be2;
    }

</style>

</head>

<body>
<div class="profile-card">

    <div class="icon">
        
    </div>

    <h1>Update Profile</h1>

    <p class="subtitle">
        Update your personal information
    </p>

    <form action="UpdateProfileServlet" method="post">

        <!-- NAME -->
        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- GENDER -->
        <div class="form-group">

            <label>Gender</label>

            <select name="gender">

                <option value="Male">Male</option>

                <option value="Female">Female</option>

            </select>

        </div>


        <!-- PHONE -->
        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

        </div>


        <!-- EMAIL -->
        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

            <label>New Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- BUTTON -->
        <button type="submit">
            Update Profile
        </button>

    </form>

</div>

</body>

</html>
