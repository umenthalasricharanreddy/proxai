<!DOCTYPE html>

<html>

<head>

<title>My Profile</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #4f46e5, #7c3aed, #9333ea);
    }

    .profile-card {
        width: 450px;
        padding: 40px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
        text-align: center;
        color: #312e81;
        margin-bottom: 30px;
    }

    .profile-info {
        margin-bottom: 18px;
        padding: 14px;
        background: #f5f3ff;
        border-radius: 8px;
        font-size: 16px;
    }

    .profile-info strong {
        color: #4f46e5;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    .update-btn {
        background: #4f46e5;
        color: white;
    }

    .update-btn:hover {
        background: #3730a3;
    }

    .back-btn {
        background: #ede9fe;
        color: #5b21b6;
    }

    .back-btn:hover {
        background: #ddd6fe;
    }

</style>

</head>

<body>

<div class="profile-card">

    <h1>My Profile</h1>

    <div class="profile-info">
        <strong>Name:</strong> User
    </div>

    <div class="profile-info">
        <strong>Gender:</strong> Male
    </div>

    <div class="profile-info">
        <strong>Phone:</strong> 1234567890
    </div>

    <div class="profile-info">
        <strong>Email:</strong> user@gmail.com
    </div>

    <div class="profile-info">
        <strong>Role:</strong> USER
    </div>

    <div class="buttons">

        <button class="update-btn"
                onclick="window.location.href='updateProfile.html'">
            Update Profile
        </button>
        
        
        
        
        
        
        

        <button class="back-btn"
                onclick="window.location.href='user.html'">
            Back
        </button>

    </div>

</div>

</body>

</html>
