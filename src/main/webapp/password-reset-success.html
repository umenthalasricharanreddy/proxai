<!DOCTYPE html>

<html>

<head>
<title>Password Reset Successful</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at top left, #35106b, transparent 40%),
            radial-gradient(circle at bottom right, #071f5c, transparent 40%),
            linear-gradient(135deg, #030014, #08001c, #020817);

        color: white;
    }

    .success-box {
        width: 430px;
        padding: 45px 35px;

        text-align: center;

        background: rgba(15, 10, 35, 0.90);

        border: 1px solid rgba(140, 90, 255, 0.4);

        border-radius: 20px;

        box-shadow: 0 0 35px rgba(100, 60, 255, 0.35);

        backdrop-filter: blur(12px);
    }

    h1 {
        font-size: 27px;

        margin-bottom: 18px;

        background: linear-gradient(
            90deg,
            #c084fc,
            #60a5fa
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .message {
        color: #c8c8d8;

        font-size: 15px;

        line-height: 1.6;

        margin-bottom: 30px;
    }

    .login-button {
        display: block;

        width: 100%;

        padding: 14px;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

        color: white;

        text-decoration: none;

        font-size: 15px;

        font-weight: bold;

        box-shadow: 0 0 18px rgba(80, 70, 255, 0.4);

        transition: 0.3s;
    }

    .login-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 0 28px rgba(100, 80, 255, 0.7);
    }

    .small-text {
        margin-top: 18px;

        color: #8888a0;

        font-size: 12px;
    }

</style>
</head>

<body>

<div class="success-box">

    <h1>Password Changed Successfully</h1>

    <p class="message">
        Your password has been changed successfully.
        You can now login using your new password.
    </p>

    <a href="projectlogin.html" class="login-button">
        Back to Login
    </a>

    <p class="small-text">
        Your account is now ready to use.
    </p>

</div>
</body>

</html>
